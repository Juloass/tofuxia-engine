plugins {
	id 'java-library'
}

dependencies {
	api project(':engine-app')
	implementation project(':vulkan-renderer')
	implementation 'io.github.juloass:localization-core:0.1.0'
	implementation 'io.github.juloass:localization-resource:0.1.0'
	implementation 'io.github.juloass:audio-core:1.0.0'
	implementation 'io.github.juloass:audio-openal:1.0.0'
	implementation 'io.github.juloass:audio-resource:1.0.0'
	implementation 'io.github.juloass:input-glfw:1.0.0'
	implementation "com.mojang:brigadier:${rootProject.ext.brigadierVersion}"
	implementation platform("org.lwjgl:lwjgl-bom:${rootProject.ext.lwjglVersion}")
	implementation "org.lwjgl:lwjgl"
	implementation "org.lwjgl:lwjgl-glfw"
}

tasks.register('m07ClientSettingsSelfTest', JavaExec) {
	group = 'verification'
	description = 'Validates versioned input, graphics, and audio settings persistence and recovery.'
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'fr.tofuxia.desktop.M07ClientSettingsSelfTest'
	workingDir = rootProject.projectDir
	dependsOn tasks.named('testClasses')
}

check.dependsOn tasks.named('m07ClientSettingsSelfTest')
