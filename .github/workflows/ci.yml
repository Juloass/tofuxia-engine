name: CI

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - run: ./gradlew clean check publishToMavenLocal --no-daemon
        if: runner.os != 'Windows'
      - run: .\gradlew.bat clean check publishToMavenLocal --no-daemon
        if: runner.os == 'Windows'
